name: Test Phishing Detection Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ML model
        run: python model.py
